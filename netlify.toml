# Netlify configuration for Next.js deployment
# This ensures API routes are handled as serverless functions with proper query parameter support
# Build docs first (generates openapi.json and VitePress static files), then build Next.js

[build]
  command = "npm run docs:build && npm run build"
  publish = ".next"

# Use Netlify's Next.js plugin for proper serverless function handling
[[plugins]]
  package = "@netlify/plugin-nextjs"

# API response headers (caching, CORS, X-Content-Type-Options, the OpenAPI
# service-desc Link) are set by the app in src/app/api/cors.ts, not here:
# netlify.toml [[headers]] apply only to static files, never to function
# responses, and every /api/* route is a function.
# Policy: a 200 is cached at Netlify's edge until the next deploy, keyed by the
# full URL including the query string; clients revalidate with an ETag (304).
# Errors are never cached. This is safe because data/*.json changes only with a
# deploy, and every deploy purges the cache.

# Note: Static files from public/docs/ should be served by Next.js automatically
# The route handler at /docs/[[...slug]] will handle HTML pages, but static
# assets like .json, .js, .css should be served directly by Netlify

# Root-level aliases for LLM discovery (LLM-audit F6)
# Use status 200 (rewrite, not redirect) so the URL the LLM sees stays stable.
# force = true to run ahead of @netlify/plugin-nextjs's router.
[[redirects]]
  from = "/llms-full.txt"
  to = "/docs/llms-full.txt"
  status = 200
  force = true

[[redirects]]
  from = "/openapi.yaml"
  to = "/docs/openapi.yaml"
  status = 200
  force = true

[[redirects]]
  from = "/openapi.json"
  to = "/docs/openapi.json"
  status = 200
  force = true

